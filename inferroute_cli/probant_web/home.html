<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Anteriora</title>
<link rel="stylesheet" href="/app.css">
<script src="/common.js" defer></script>
<script src="/home.js" defer></script>
</head>
<body class="home">
<header class="top">
  <button type="button" class="brand" id="brand" title="Your matters"><svg class="mark" viewBox="6 21 47 32" fill="none" stroke-linecap="round" aria-hidden="true"><circle class="point" cx="13" cy="40" r="4"/><circle cx="37" cy="37" r="12" stroke="currentColor" stroke-width="4"/><line x1="49" y1="24" x2="49" y2="49" stroke="currentColor" stroke-width="4"/></svg>Anteriora</button>
  <nav class="nav" id="nav" hidden>
    <button type="button" class="ghost" data-route="#/">Matters</button>
    <button type="button" class="ghost" data-route="#/sharing">Sharing</button>
    <button type="button" class="ghost" data-route="#/help">Help</button>
  </nav>
  <div class="top-actions">
    <button id="read-document" class="ghost" type="button" hidden>Read a document</button>
    <button id="read-repo" class="ghost" type="button" hidden>Read a repository</button>
    <button id="new-matter" class="primary" type="button" hidden>New matter</button>
  </div>
</header>

<div id="nokey" class="nokey" hidden>
  <h1>Open the link from your terminal</h1>
  <p>This page needs the link printed when Anteriora home started. Go back to the terminal where you ran
    <code>anteriora home</code> and open the address it printed.</p>
</div>

<main class="page" id="page" hidden></main>
<footer class="legal" id="legal" hidden></footer>

<div id="dialog" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
